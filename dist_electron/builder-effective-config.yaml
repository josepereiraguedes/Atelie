directories:
  output: dist_electron
  buildResources: build
appId: com.atelie.gestao
productName: Sistema Gestão Ateliê
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sistema Gestão Ateliê
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
publish:
  provider: github
  owner: seu-usuario
  repo: sistema-gestao-atelie
  releaseType: release
electronVersion: 38.3.0
