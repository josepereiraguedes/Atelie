directories:
  output: dist_electron
  buildResources: build
appId: com.atelie.gestao
productName: Sistema Gestão Ateliê
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - server/**/*
      - local_database/**/*
      - package.json
      - icon.svg
      - '!node_modules/.cache/**/*'
      - '!src/**/*'
      - '!scripts/**/*'
      - '!tests/**/*'
      - '!*.md'
      - '!INICIAR_SISTEMA.bat'
extraResources:
  - filter:
      - server/**/*
      - local_database/**/*
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
win:
  target:
    - nsis
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sistema Gestão Ateliê
  deleteAppDataOnUninstall: true
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
publish: null
electronVersion: 38.3.0
